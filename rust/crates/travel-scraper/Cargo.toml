[package]
name = "travel-scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chromiumoxide = "0.9.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
serde_json = "1"
libsql = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
