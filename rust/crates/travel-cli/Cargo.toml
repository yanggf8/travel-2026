[package]
name = "travel-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "travel"
path = "src/main.rs"

[dependencies]
# verify-site layer 5 (--render): attach-only CDP client from gwebcdb (consumed, never edited).
bridge-core = { path = "../../../../gwebcdb/crates/bridge-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
libsql = "0.6"
png = "0.17"
regex = "1"
# verify-site layer 1: a real HTML parser + CSS selectors for the live viewer page.
scraper = "0.27"
# verify-site layer 5: the render metrics object is decoded into typed structs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
travel-db = { path = "../travel-db" }
turso-util = { path = "../turso-util" }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
