[package]
name = "trip-dashboard-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
worker-github-oauth = { path = "../../../gwebcdb/crates/worker-github-oauth" }
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
