[package]
name = "trip-dashboard-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `d1` feature: the compare-only D1 read-mirror pilot (src/d1_compare.rs) uses env.d1("MIRROR_DB").
# Inert unless the D1_COMPARE_ENABLED var is set AND a MIRROR_DB binding exists — normal deploys unaffected.
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
worker-github-oauth = { path = "../../../gwebcdb/crates/worker-github-oauth" }
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
